<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Base Apparel coming soon page</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <div class="log">
      <img src="./images/logo.svg" alt="logo">
    </div>
  </div>

  <div class="container">
  
    <div class="text-box">
      <h1><span>We're</span> coming soon</h1>

      <p>Hello fellow shoppers! We're currently building our new fashion store. Add your email below to stay up-to-date with announcements and our launch deals.</p>
      
      <form id="email-form">
        <input type="email" name="email" id="email" placeholder="Email Address" >
        <button type="submit" id="btn"><img src="./images/icon-arrow.svg" alt=""></button>
      </form>
      <span id="error-message"></span>
    </div>

    <div class="image-container">
      <img src="./images/hero-desktop.jpg" alt="">
    </div>

  </div>

  
<script src="script.js"></script>
</body>
</html>
